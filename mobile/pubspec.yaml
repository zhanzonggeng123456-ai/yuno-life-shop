name: yuno_life
publish_to: none
description: Yuno Life native secondhand marketplace.
version: 0.4.7+12
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.0
  shared_preferences: ^2.3.0
dev_dependencies:
  shared_preferences_android: ^2.5.4
  integration_test:
    sdk: flutter
  image_picker_platform_interface: ^2.11.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-NotoSerifSC.txt
  fonts:
    - family: YunoSerif
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
