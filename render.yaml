# Non-trial Free compute only. Customer data lives in Turso, never this disk.
# Import into a new EMPTY libSQL database BEFORE starting the first deployment.
services:
  - type: web
    name: yuno-life-shop-free
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: YUNO_STORAGE_MODE
        value: remote
      - key: YUNO_PHOTO_STORAGE
        value: database
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
