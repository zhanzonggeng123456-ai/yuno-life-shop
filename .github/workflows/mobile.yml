name: Native 0.4.7 validation
on:
  push:
    branches: [main, codex/flutter-native-app, codex/integrate-native-cloud]
    paths: ['app/**', 'tests/**', 'mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.9
          git -C "$RUNNER_TEMP/flutter" checkout --detach 3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Validate unified native client
        working-directory: mobile
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test --no-pub test
      - name: Compile distribution candidate without signing
        working-directory: mobile
        run: |
          flutter build ipa --release --no-codesign --dart-define=API_BASE_URL=https://yuno-life-shop-free.onrender.com
          ditto -c -k --sequesterRsrc --keepParent build/ios/archive/Runner.xcarchive build/ios/yuno-unsigned.xcarchive.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-unsigned-candidate
          path: mobile/build/ios/yuno-unsigned.xcarchive.zip
