name: Native mobile validation
on:
  push:
    branches: [codex/mobile-app]
    paths: ['app/**', 'tests/**', 'mobile/**', '.github/workflows/mobile.yml', 'requirements.txt']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.9
          git -C "$RUNNER_TEMP/flutter" checkout --detach 3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Start isolated acceptance server
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          export YUNO_DB_PATH="$RUNNER_TEMP/mobile-qa/yuno.db"
          export YUNO_UPLOAD_DIR="$RUNNER_TEMP/mobile-qa/uploads"
          nohup .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8765 > "$RUNNER_TEMP/yuno-server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/api/v1/config > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/healthz
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android acceptance
        timeout-minutes: 20
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile
          script: YUNO_QA=true flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d emulator-5554 --dart-define=YUNO_SERVER=http://10.0.2.2:8765
      - name: Build internal Android package
        working-directory: mobile
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yuno-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
  ios:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.9
          git -C "$RUNNER_TEMP/flutter" checkout --detach 3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Backend regression and isolated acceptance server
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -m pytest tests -q
          export YUNO_DB_PATH="$RUNNER_TEMP/mobile-qa/yuno.db"
          export YUNO_UPLOAD_DIR="$RUNNER_TEMP/mobile-qa/uploads"
          nohup .venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/yuno-server.log" 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8765/api/v1/config > /dev/null && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/healthz
      - name: Flutter static and widget checks
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test test
      - name: Boot iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          groups=json.load(sys.stdin)["devices"]
          for runtime in sorted(groups, reverse=True):
              for device in groups[runtime]:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Native iOS acceptance
        timeout-minutes: 20
        working-directory: mobile
        run: |
          set -o pipefail
          flutter drive --verbose --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d "$DEVICE_ID" --dart-define=YUNO_SERVER=http://127.0.0.1:8765 2>&1 | tee "$RUNNER_TEMP/yuno-ios-driver.log"
      - name: Build and launch simulator app
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        working-directory: mobile
        run: |
          flutter build ios --simulator --debug --dart-define=YUNO_SERVER=http://127.0.0.1:8765
          xcrun simctl install "$DEVICE_ID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE_ID" com.yunolife.shop
          sleep 4
          xcrun simctl io "$DEVICE_ID" screenshot build/ios/yuno-iphone.png
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/yuno-ios-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yuno-ios-simulator
          path: |
            mobile/build/ios/yuno-ios-simulator.zip
            mobile/build/ios/yuno-iphone.png
            /Users/runner/work/_temp/yuno-server.log
            /Users/runner/work/_temp/yuno-ios-driver.log
          if-no-files-found: ignore
