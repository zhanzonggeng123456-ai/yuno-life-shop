name: Native simulator full acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Prepare pinned Flutter SDK
        run: |
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin tag 3.47.9
          git -C "$RUNNER_TEMP/flutter" checkout --detach 3.47.9
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = c197ca5199e9ee5661e865596c9c07294dfab51c
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          xcodebuild -version
          "$RUNNER_TEMP/flutter/bin/flutter" precache --ios
      - name: Isolated API and current iPhone simulator flow
        run: |
          set -euo pipefail
          PROJECT_ROOT="$PWD"
          API_PID=''
          ROLE_PID=''
          DEVICE_ID=''
          cleanup_fixture() {
            for TEST_PID in "$ROLE_PID" "$API_PID"; do
              if [ -n "$TEST_PID" ]; then
                kill "$TEST_PID" 2>/dev/null || true
                wait "$TEST_PID" 2>/dev/null || true
              fi
            done
            API_PID=''
            ROLE_PID=''
          }
          finish() {
            cleanup_fixture
            if [ -n "$DEVICE_ID" ]; then
              xcrun simctl shutdown "$DEVICE_ID" 2>/dev/null || true
            fi
          }
          trap finish EXIT
          DEVICE_ID=$(xcrun simctl list devices available -j | python -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable") and "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          FLOW_INDEX=0
          for FLOW in native role closure settlement; do
            FLOW_INDEX=$((FLOW_INDEX + 1))
            RUN_ID="${GITHUB_RUN_ID}${FLOW_INDEX}"
            export ACCEPTANCE_RUN_ID="$RUN_ID"
            export YUNO_DB_PATH="$PROJECT_ROOT/data/acceptance-$RUN_ID/yuno.db"
            export YUNO_UPLOAD_DIR="$PROJECT_ROOT/data/acceptance-$RUN_ID/uploads"
            cd "$PROJECT_ROOT"
            python -m uvicorn app.main:app --host 127.0.0.1 --port 8765 > "$RUNNER_TEMP/native-$FLOW-api.log" 2>&1 &
            API_PID=$!
            READY=0
            for ATTEMPT in $(seq 1 30); do
              if curl -fsS --max-time 3 -o /dev/null http://127.0.0.1:8765/api/v2/config; then
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" != 1 ]; then
              cat "$RUNNER_TEMP/native-$FLOW-api.log"
              exit 1
            fi
            python mobile/tool/acceptance_roles.py --db "$YUNO_DB_PATH" --run-id "$RUN_ID" --lifecycle-fixtures > "$RUNNER_TEMP/native-$FLOW-roles.log" 2>&1 &
            ROLE_PID=$!
            cd mobile
            flutter test --verbose "integration_test/${FLOW}_flow_test.dart" -d "$DEVICE_ID" --dart-define=API_BASE_URL=http://127.0.0.1:8765 --dart-define=ACCEPTANCE_RUN_ID="$RUN_ID"
            cleanup_fixture
          done
